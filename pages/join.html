<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>
    <link rel="icon" href="../images/wip-logo.svg">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/join.css">
</head>
<body>
    <div class="main">
        <div class="main-left">
            <div class="subscriptions-overview">
                <div class="sub-overview-header">
                    <img src="/images/wip-logo.svg" alt=""> 
                    WIP
                </div>
                <div class="sub-price-info">
                    <div class="sub-price-info-header">
                        <h4>Subscribe to WIP Pro Membership</h4>
                    </div>
                    <div class="sub-price">
                        $29.00 <span>per month</span>
                    </div>
                </div>
            </div>
            <div class="pro-deal-card">
                <div class="pro-deal-title">
                    <div class="pro-deal-info">
                    <h4>WIP Pro Membership</h4>
                    <span>US$29.00</span>
                </div>
                <p>Billed monthly</p>
                </div>
                <div class="pro-deal-benefits">
                    <div class="deal-benefit-left">
                    <label class="toggle">
                        <input type="checkbox" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="save-deal">Save $1999.00</span> 
                    <p>with annual billing</p>
                    </div>
                    <div class="deal-benefit-right">
                        <p>$16.58/month</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="main-right">
        <div class="sub-fill-in">
            <div class="fill-in-header">
                <h4>Contact information</h4>
            </div>  
            </div>
        </div>  
    </div>
</body>
</html>
